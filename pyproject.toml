[project]
name = "torvalds-skill"
version = "0.1.0"
description = "Distill Linus Torvalds' review method from LKML into a reusable skill"
requires-python = ">=3.11"
license = "CC0-1.0"
dependencies = [
    "aiohttp>=3.9.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
