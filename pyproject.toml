[project]
name = "torvalds-skill"
version = "0.1.0"
description = "Distill Linus Torvalds' review method from LKML into a reusable skill"
requires-python = ">=3.11"
license = "CC0-1.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
